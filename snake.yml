name: Gerar cobrinha
 
on:
  # atualiza a cada 12 horas
  schedule:
    - cron: "0 */12 * * *"
  # permite rodar manualmente pela aba Actions
  workflow_dispatch:
  # roda também quando você altera o README
  push:
    branches:
      - main
      - master
 
permissions:
  contents: write
 
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Gerar os SVGs da cobrinha (paleta cyber sunset)
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#0FB5E0&color_dots=#ECE4F7,#C58BFF,#FF2BD6,#FF8A1F,#F5A000
            dist/github-snake-dark.svg?color_snake=#28E0FF&color_dots=#2B1A55,#6A1B9A,#FF2BD6,#FF8A1F,#FFD23F
 
      - name: Enviar para a branch output
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
